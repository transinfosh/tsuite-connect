name: Support session security checks

on:
  push:
    branches:
      - main
    paths:
      - "control/**"
      - "bastion/**"
      - "console/**"
      - "customer/**"
      - "operator/**"
      - "tests/**"
      - ".github/workflows/support-session.yml"
  pull_request:
    paths:
      - "control/**"
      - "bastion/**"
      - "console/**"
      - "customer/**"
      - "operator/**"
      - "tests/**"
      - ".github/workflows/support-session.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install shell tools
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck openssh-server
          sudo install -d -m 0755 /run/sshd

      - name: Check Python and shell syntax
        run: |
          python3 -m py_compile bastion/*.py console/*.py operator/tsuite-connect operator/*.py customer/*.py
          for script in control/*.sh bastion/*.sh customer/*.sh operator/*.sh; do bash -n "$script"; done

      - name: Run support-session tests
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          tests/test_ssh_restrictions.sh
          python3 tests/verify_portable_ssh.py

      - name: Run ShellCheck
        run: >-
          shellcheck --severity=warning control/*.sh
          bastion/*.sh customer/*.sh operator/*.sh
          tests/test_ssh_restrictions.sh
